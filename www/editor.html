<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Editor</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <div class="editor-topbar">
    <button class="icon-btn" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <input id="titleInput" class="editor-title-input" placeholder="Titulo de la nota">
    <div class="mode-toggle">
      <button id="modeTextBtn" title="Texto tradicional">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
      </button>
      <button id="modeFreeBtn" title="Cuaderno libre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="moreBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
  </div>

  <!-- Modo libre: lienzo tipo cuaderno -->
  <div class="canvas-wrap hidden" id="canvasWrap">
    <div class="canvas-dot" id="canvas"></div>
  </div>

  <!-- Modo texto tradicional -->
  <div class="text-mode-wrap hidden" id="textModeWrap">
    <textarea id="textArea" placeholder="Escribe aqui..."></textarea>
  </div>

  <div class="editor-bottombar" id="freeToolbar">
    <button class="tool-btn" id="addTextBtn"><span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></span>Texto</button>
    <button class="tool-btn" id="addImageBtn"><span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>Imagen</button>
    <button class="tool-btn" id="addPageBtn"><span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>Mas espacio</button>
  </div>

  <input type="file" id="imageInput" accept="image/*" class="hidden">

  <!-- Sheet de opciones (mismo estilo que la lista) -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="actionSheet">
    <div class="sheet-handle"></div>
    <div style="font-size:17px;font-weight:800;margin-bottom:14px;">Opciones de la nota</div>
    <div class="sheet-grid">
      <button class="sheet-btn danger" data-action="delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Eliminar
      </button>
      <button class="sheet-btn" data-action="archive">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/></svg>
        Archivar
      </button>
      <button class="sheet-btn" data-action="duplicate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Duplicar
      </button>
      <button class="sheet-btn" data-action="export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Exportar
      </button>
      <button class="sheet-btn" id="pinBtn" data-action="pin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14l-1.4-4.2A2 2 0 0 0 15.7 11H8.3a2 2 0 0 0-1.9 1.8z"/></svg>
        Fijar
      </button>
      <button class="sheet-btn" id="lockBtn" data-action="lock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Bloquear
      </button>
    </div>

    <div class="sheet-info-row" id="categoryRow">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/></svg></div>
      <div>
        <div class="label">Categoria (toca para cambiar)</div>
        <div class="value" id="sheetCategory">Sin categoria</div>
      </div>
    </div>
  </div>

</div>
<script src="js/db.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
